# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G
org.gradle.configuration-cache=true

projecte_version=1.1.0
minecraft_version=1.21.11
#Used as a helper for porting when deps we use have not updated yet
previous_minecraft_version=1.21.1
previous_minor_minecraft_version=1.21
loader_version_range=[4,)
neo_version=21.11.48
# This determines the minimum version of NeoForge required to use ProjectE
# Only bump it whenever we need access to a feature in NeoForge that is not available in earlier versions
neo_version_range=[21.11.48,)
minecraft_version_range=[1.21.11]

junit_version=5.11.4

#misc settings
# recipe viewer, currently accepts: jei, emi, hybrid
# 1.21.11 port: EMI has no 1.21.11 build yet, so only jei is usable for now
recipe_viewer=jei

# Mod dependency versions
curios_version=14.0.0+1.21.11
jei_version=27.54.0.116
jade_version=21.1.7+neoforge
top_version=1.21.11_neo-13.0.0-1
wthit_version=18.2.3

#Outdated mod dependencies
# crafttweaker_version / emi_version / jade_api_id / jade_id are intentionally removed for the 1.21.11 port:
# CraftTweaker and EMI have no 1.21.11 builds yet; Jade is now resolved from the Modrinth maven repository.
