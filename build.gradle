//Tests are opt-in on 1.21.11 until the NeoForge test framework stops crashing its JVM on shutdown.
def runProjecteTests = providers.gradleProperty('runProjecteTests').isPresent()
test {
    useJUnitPlatform()
    //1.21.11 + JDK 21: FML's ClassLoadingGuardian needs the SecurityManager to be allowed for the
    //NeoForge test framework's ephemeral server, otherwise tests die with an IllegalAccessError.
    jvmArgs('-Djava.security.manager=allow')
    //NeoForge's ephemeral test server can only be bootstrapped once per JVM; give every test class its own JVM.
    forkEvery = 1
    //Known issue on 1.21.11: the NeoForge 21.11 test framework JVM sometimes exits with 255 while
    //shutting down its ephemeral server (all tests still report as passed). Gradle treats the exit
    //code as a hard failure, so tests are opt-in until upstream FML fixes the shutdown race.