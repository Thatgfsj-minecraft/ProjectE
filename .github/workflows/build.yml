name: Build

# Per org policy: CI is not run for every PR; it runs for release tags and on demand.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
          cache-read-only: false

      - name: Build (compile + jar)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Unit tests (informational)
        # The NeoForge 21.11 test framework can crash its JVM while shutting down the ephemeral
        # server even though every test passed; keep this step non-blocking until FML fixes it.
        continue-on-error: true
        run: ./gradlew test -PrunProjecteTests --no-daemon --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProjectE-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
